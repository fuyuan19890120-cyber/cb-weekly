name: weekly-cb-run

on:
  schedule:
    - cron: '37 3 * * 5'   # UTC 03:37 = 北京时间 11:37, 错峰避免整点拥堵
  workflow_dispatch: {}     # 支持手动触发

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: weekly-cb-run
  cancel-in-progress: false

jobs:
  run-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run weekly strategy
        env:
          CB_REDIS_URL: ${{ secrets.CB_REDIS_URL }}
          CB_FEISHU_WEBHOOK: ${{ secrets.CB_FEISHU_WEBHOOK }}
        run: python scripts/weekly_run.py

      - name: Commit & push data
        run: |
          git config user.name "cb-weekly-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "no changes" || {
            git commit -m "weekly run $(date -u +%F)"
            git push
          }

      # 直接部署（不依赖 chained workflow trigger）
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
