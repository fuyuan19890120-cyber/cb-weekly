name: weekly-cb-run

on:
  schedule:
    - cron: '0 3 * * 5'   # UTC 03:00 = 北京时间 11:00, 留3h余量应对Actions延迟, 通常13:00前到达
  workflow_dispatch: {}     # 支持手动触发

permissions:
  contents: write

concurrency:
  group: weekly-cb-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run weekly strategy
        env:
          CB_REDIS_URL: ${{ secrets.CB_REDIS_URL }}
          CB_FEISHU_WEBHOOK: ${{ secrets.CB_FEISHU_WEBHOOK }}
        run: python scripts/weekly_run.py

      - name: Commit & push data
        run: |
          git config user.name "cb-weekly-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "no changes" || {
            git commit -m "weekly run $(date -u +%F)"
            git push
          }
